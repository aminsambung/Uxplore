name: Build Android APK

# ═══════════════════════════════════════════
# KAPAN WORKFLOW DIJALANKAN
# ═══════════════════════════════════════════
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

# ═══════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════
jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────
      # 1. Checkout kode dari repository
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # 2. Setup Java JDK 17
      # ─────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─────────────────────────────────────
      # 3. Setup Android SDK
      # ─────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─────────────────────────────────────
      # 4. Cache Gradle (biar build cepat)
      # ─────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─────────────────────────────────────
      # 5. Beri izin executable ke gradlew
      # ─────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─────────────────────────────────────
      # 6. Build Debug APK
      # ─────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ─────────────────────────────────────
      # 7. Build Release APK (unsigned)
      # ─────────────────────────────────────
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # ─────────────────────────────────────
      # 8. Upload Debug APK sebagai artifact
      # ─────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # ─────────────────────────────────────
      # 9. Upload Release APK sebagai artifact
      # ─────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
